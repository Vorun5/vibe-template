# Default mode: custom-image builds with configs COPY'd into the image.
# This is the right mode for Docker Swarm / Dokploy (bind mount doesn't
# work there). For local dev with hot-reloadable config files, layer the
# dev override:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  prometheus:
    build: ./prometheus
    container_name: ${PROJECT_NAME:-monitoring}-prometheus
    restart: unless-stopped
    # Required so Prometheus can read /var/run/docker.sock for Docker SD.
    # Trade-off: container has root-equivalent access on the host via the
    # socket. Don't expose this port publicly without auth in front.
    user: root
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - prometheus-data:/prometheus
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}"
      - "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-10GB}"
      - "--web.enable-lifecycle"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"

  grafana:
    build: ./grafana
    container_name: ${PROJECT_NAME:-monitoring}-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD is required — set it in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.3"

  loki:
    build: ./loki
    container_name: ${PROJECT_NAME:-monitoring}-loki
    restart: unless-stopped
    ports:
      - "${LOKI_HOST_PORT:-3100}:3100"
    volumes:
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.3"

  promtail:
    build: ./promtail
    container_name: ${PROJECT_NAME:-monitoring}-promtail
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.1"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: ${PROJECT_NAME:-monitoring}-node-exporter
    restart: unless-stopped
    ports:
      - "${NODE_EXPORTER_HOST_PORT:-9100}:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"

  # Remove this service if your project has no Postgres. Don't forget to
  # also drop the `postgres-exporter` job from prometheus.yml and the
  # postgresql.json dashboard.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: ${PROJECT_NAME:-monitoring}-postgres-exporter
    restart: unless-stopped
    ports:
      - "${POSTGRES_EXPORTER_HOST_PORT:-9187}:9187"
    environment:
      - DATA_SOURCE_NAME=${POSTGRES_EXPORTER_DSN:-}
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"

volumes:
  prometheus-data:
  grafana-data:
  loki-data:

# OPTIONAL: external network for Dokploy / Docker Swarm.
#
# Uncomment the `networks:` block on each service AND the top-level
# `networks:` block below, then `export EXTERNAL_NETWORK_NAME=dokploy-network`
# (or whatever your platform uses). Required so Prometheus + Promtail can
# reach the application containers running on that network.
#
# Without the override, all services share the default compose network and
# work fine for plain `docker compose up`.
#
# networks:
#   default: {}
#   external_net:
#     name: ${EXTERNAL_NETWORK_NAME}
#     external: true
