apiVersion: 1

# Fixed UIDs are LOAD-BEARING. Dashboards reference datasources by uid,
# so renaming or dropping these breaks every provisioned dashboard on
# the next redeploy. Don't change `prometheus` / `loki`.
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: prometheus
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: loki
    editable: false
